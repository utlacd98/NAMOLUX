
  <svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E7B83F"/>
        <stop offset="1" stop-color="#C9952D"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#111111"/>
        <stop offset="1" stop-color="#181512"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      </filter>
      <style>
        .brand { font: 800 34px Georgia, serif; fill: #F8F5EC; letter-spacing: 0; }
        .brandGold { fill: #E7B83F; }
        .eyebrow { font: 700 24px Arial, sans-serif; fill: #E7B83F; letter-spacing: 3px; }
        .h1 { font: 800 82px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .h1Small { font: 800 66px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .body { font: 400 34px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .bodyStrong { font: 700 34px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .tiny { font: 600 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .metric { font: 800 58px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .label { font: 700 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
