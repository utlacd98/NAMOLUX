    </defs>
    <rect width="1080" height="1080" fill="#050505"/>
    <rect x="34" y="34" width="1012" height="1012" rx="34" fill="url(#panel)" stroke="#2b261a" stroke-width="2"/>
    <g transform="translate(72 74)">
      <text class="brand">Namo<tspan class="brandGold">Lux</tspan></text>
    </g>
    <text x="72" y="1008" class="tiny">namolux.com/generate</text>
    <text x="1008" y="1008" text-anchor="end" class="tiny">Founder Signal&#8482;</text>
    <text x="72" y="190" class="eyebrow">FOR FOUNDERS</text>
