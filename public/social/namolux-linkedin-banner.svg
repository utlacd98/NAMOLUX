
  <svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E7B83F"/>
        <stop offset="1" stop-color="#C9952D"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#111111"/>
        <stop offset="1" stop-color="#181512"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      </filter>
      <style>
        .brand { font: 800 34px Georgia, serif; fill: #F8F5EC; letter-spacing: 0; }
        .brandGold { fill: #E7B83F; }
        .eyebrow { font: 700 24px Arial, sans-serif; fill: #E7B83F; letter-spacing: 3px; }
        .h1 { font: 800 82px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .h1Small { font: 800 66px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .body { font: 400 34px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .bodyStrong { font: 700 34px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .tiny { font: 600 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .metric { font: 800 58px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .label { font: 700 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
      </style>
    </defs>
    <rect width="1600" height="900" fill="#050505"/>
    <rect x="34" y="34" width="1532" height="832" rx="34" fill="url(#panel)" stroke="#2b261a" stroke-width="2"/>
    <g transform="translate(72 74)">
      <text class="brand">Namo<tspan class="brandGold">Lux</tspan></text>
    </g>
    <text x="72" y="828" class="tiny">namolux.com/bulk-domain-check</text>
    <text x="1528" y="828" text-anchor="end" class="tiny">Founder Signal&#8482;</text>
    <text x="72" y="190" class="eyebrow">NAMING TOOL FOR BUILDERS</text>
    <text x="72" y="292" class="h1">A better way to</text>
    <text x="72" y="352" class="body"></text>
    <text x="72" y="372" class="h1">choose a domain.</text>
    <text x="72" y="444" class="body">Founder Signal scoring and live availability.</text>
    <g transform="translate(920 196)" filter="url(#softShadow)">
      <rect width="560" height="470" rx="34" fill="#0B0B0B" stroke="#302718" stroke-width="2"/>
      <text x="48" y="90" class="bodyStrong">Shortlist score</text>
      <text x="48" y="176" class="metric">94</text>
      <text x="160" y="172" class="label">vaulten</text>
      <line x1="48" y1="228" x2="512" y2="228" stroke="#2A2A2A"/>
      <text x="48" y="292" class="metric">92</text>
      <text x="160" y="288" class="label">paynest</text>
      <line x1="48" y1="344" x2="512" y2="344" stroke="#2A2A2A"/>
      <text x="48" y="408" class="metric">88</text>
      <text x="160" y="404" class="label">clearbitx</text>
    </g>
    <rect x="72" y="640" width="330" height="74" rx="20" fill="url(#gold)"/>
    <text x="237" y="687" text-anchor="middle" font-family="Arial" font-size="28" font-weight="900" fill="#080808">Try it free</text>
  
  </svg>