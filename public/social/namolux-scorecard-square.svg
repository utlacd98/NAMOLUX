
  <svg width="1080" height="1080" viewBox="0 0 1080 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#E7B83F"/>
        <stop offset="1" stop-color="#C9952D"/>
      </linearGradient>
      <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#111111"/>
        <stop offset="1" stop-color="#181512"/>
      </linearGradient>
      <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
      </filter>
      <style>
        .brand { font: 800 34px Georgia, serif; fill: #F8F5EC; letter-spacing: 0; }
        .brandGold { fill: #E7B83F; }
        .eyebrow { font: 700 24px Arial, sans-serif; fill: #E7B83F; letter-spacing: 3px; }
        .h1 { font: 800 82px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .h1Small { font: 800 66px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .body { font: 400 34px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .bodyStrong { font: 700 34px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .tiny { font: 600 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
        .metric { font: 800 58px Arial, sans-serif; fill: #F8F5EC; letter-spacing: 0; }
        .label { font: 700 24px Arial, sans-serif; fill: #AFA89B; letter-spacing: 0; }
      </style>
    </defs>
    <rect width="1080" height="1080" fill="#050505"/>
    <rect x="34" y="34" width="1012" height="1012" rx="34" fill="url(#panel)" stroke="#2b261a" stroke-width="2"/>
    <g transform="translate(72 74)">
      <text class="brand">Namo<tspan class="brandGold">Lux</tspan></text>
    </g>
    <text x="72" y="1008" class="tiny">namolux.com/bulk-domain-check</text>
    <text x="1008" y="1008" text-anchor="end" class="tiny">Founder Signal&#8482;</text>
    <text x="72" y="190" class="eyebrow">NAMOLUX</text>
    <text x="72" y="292" class="h1">Names with proof.</text>
    <text x="72" y="352" class="body">Compare a shortlist by score, fit, and availability.</text>
    <g filter="url(#softShadow)">
      <rect x="96" y="448" width="888" height="350" rx="28" fill="#0B0B0B" stroke="#302718" stroke-width="2"/>
      <text x="144" y="526" class="bodyStrong">vaulten.com</text>
      <text x="144" y="588" class="body">Trust signal. Clean two-syllable close.</text>
      <circle cx="846" cy="560" r="76" fill="url(#gold)"/>
      <text x="846" y="580" text-anchor="middle" font-family="Arial" font-size="58" font-weight="900" fill="#080808">94</text>
      <rect x="144" y="664" width="196" height="54" rx="27" fill="#102015" stroke="#245C3D"/>
      <text x="242" y="700" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#63D39A">.com live</text>
      <rect x="364" y="664" width="186" height="54" rx="27" fill="#131313" stroke="#2D2D2D"/>
      <text x="457" y="700" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#F8F5EC">.io checked</text>
      <rect x="574" y="664" width="172" height="54" rx="27" fill="#131313" stroke="#2D2D2D"/>
      <text x="660" y="700" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#F8F5EC">.ai checked</text>
